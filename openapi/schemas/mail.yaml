          },
          "threadId": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "MailDraftDto": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "companyId",
          "revision",
          "state",
          "fromAccountId",

          "subject",
          "preview",
          "receivedAt",
          "isRead",
          "isImportant",
          "projectId",
          "attachmentCount",
          "revision"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "companyId": {

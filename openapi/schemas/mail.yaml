          "confidence": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "source": {
            "type": "string",
            "enum": [
              "RULE",
              "BACKEND_RECOMMENDATION"
            ]
          },
          "requiresConfirmation": {
            "type": "boolean",
            "const": true
          }
        }

          "externalId": {
            "type": "string",
            "minLength": 1
          },
          "deepLink": {
            "type": "string",
            "format": "uri"
          },
          "lastSyncedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "syncStatus": {
            "type": "string",
            "enum": [
              "UNKNOWN",
              "CURRENT",
              "STALE",
              "FAILED"
            ]
          },
          "readOnly": {
            "type": "boolean",
            "const": true
          }
        }

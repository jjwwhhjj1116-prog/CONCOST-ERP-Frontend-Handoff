          "sendSupported": {
            "type": "boolean"
          },
          "threadingSupported": {
            "type": "boolean"
          },
          "labelsSupported": {
            "type": "boolean"
          },
          "searchSupported": {
            "type": "boolean"
          },
          "archiveSupported": {
            "type": "boolean"
          },
          "spamSupported": {
            "type": "boolean"
          },
          "deliveryTrackingSupported": {
            "type": "boolean"
          },
          "reminderSupported": {
            "type": "boolean"
          },
          "projectLinkSupported": {
            "type": "boolean"
          },
          "maxAttachmentSize": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1
          },
          "syncStatus": {
            "type": "string",
            "enum": [
              "NOT_CONFIGURED",
              "IDLE",
              "SYNCING",
              "DEGRADED",
              "FAILED"
            ]
          },
          "gouMode": {
            "type": "string",
            "enum": [
              "LEGACY_GOU_ONLY",
              "GOU_LINK",
              "READ_ONLY_MIRROR",
              "API_SANDBOX",
              "PILOT",
              "PRODUCTION_PRIMARY"

          "action": {
            "type": "string",
            "enum": [
              "MARK_READ",
              "MARK_UNREAD",
              "MARK_IMPORTANT",
              "UNMARK_IMPORTANT",
              "MOVE",
              "DELETE",
              "RESTORE"

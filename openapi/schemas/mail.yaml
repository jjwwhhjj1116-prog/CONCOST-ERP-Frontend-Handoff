        "type": "object",
        "additionalProperties": false,
        "required": [
          "trashRetentionDays",
          "spamRetentionDays",
          "draftStaleDays",
          "hardDeleteAllowed",
          "legalHoldSupported",
          "providerRetentionSummary"

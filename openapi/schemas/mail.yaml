          "to": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "subject": {
            "type": "string"
          },
          "preview": {
            "type": "string"
          },
          "receivedAt": {
            "type": "string",
            "format": "date-time"
          },
          "isRead": {
            "type": "boolean"
          },
          "isImportant": {
            "type": "boolean"
          },
          "projectId": {
            "type": [
              "string",
              "null"
            ]
          },
          "attachmentCount": {
            "type": "integer",
            "minimum": 0
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "MailMessageDetailDto": {
        "type": "object",
        "additionalProperties": false,

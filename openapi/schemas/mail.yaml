        "properties": {
          "trashRetentionDays": {
            "type": "integer",
            "const": 30
          },
          "spamRetentionDays": {
            "type": "integer",
            "const": 30
          },
          "draftStaleDays": {
            "type": "integer",
            "const": 90
          },
          "hardDeleteAllowed": {
            "type": "boolean"
          },
          "legalHoldSupported": {
            "type": "boolean"
          },
          "providerRetentionSummary": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          }
        }
      },
      "SuggestedProjectLinkDto": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "projectId",
          "reasonCode",
          "confidence",
          "source",
          "requiresConfirmation"
        ],
        "properties": {
          "projectId": {
            "type": "string",
            "minLength": 1

            "minLength": 1,
            "maxLength": 200
          },
          "to": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "cc": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "bcc": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "subject": {
            "type": "string"
          },
          "bodyFormat": {
            "type": "string",
            "enum": [
              "TEXT",
              "HTML"
            ]
          },
          "body": {
            "type": "string"
          },
          "projectId": {
            "type": [
              "string",
              "null"
            ]
          },
          "attachmentRefs": {
            "type": "array",
            "items": {
              "$ref": "./collaboration-common.yaml#/components/schemas/CollaborationFileReference"
            }
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "SaveMailDraftRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "fromAccountId",
          "to",
          "subject",
          "bodyFormat",
          "body"
        ],
        "properties": {
          "fromAccountId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "to": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "cc": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "bcc": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MailAddressDto"
            }
          },
          "subject": {
            "type": "string",
            "maxLength": 500
          },
          "bodyFormat": {
            "type": "string",
            "enum": [
              "TEXT",
              "HTML"
            ]
          },

{
  "components": {
    "schemas": {
      "ErrorCode": {
        "type": "string",
        "enum": [
          "AUTH_REQUIRED",
          "SESSION_EXPIRED",
          "COMPANY_REQUIRED",
          "COMPANY_FORBIDDEN",
          "ACTION_FORBIDDEN",
          "VALIDATION_FAILED",
          "RESOURCE_NOT_FOUND",
          "REVISION_CONFLICT",
          "IDEMPOTENCY_CONFLICT",
          "INVALID_TRANSITION",
          "FILE_NOT_READY",
          "FILE_QUARANTINED",
          "PROVIDER_NOT_CONFIGURED",
          "SERVER_NOT_CONFIGURED",
          "RATE_LIMITED",
          "SERVICE_UNAVAILABLE",
          "INTERNAL_ERROR"
        ]
      },
      "FieldError": {
        "type": "object",
        "required": [
          "field",
          "messageKey"
        ],
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string"
          },
          "messageKey": {
            "type": "string"
          }
        }
      },
      "ErrorBody": {
        "type": "object",
        "required": [
          "code",
          "messageKey",
          "requestId",
          "details",
          "retryable"
        ],
        "additionalProperties": false,
        "properties": {
          "code": {
            "$ref": "#/components/schemas/ErrorCode"
          },
          "messageKey": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          },
          "details": {
            "type": "object",
            "properties": {
              "fieldErrors": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/FieldError"
                }
              }
            },
            "additionalProperties": true
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "example": {
          "code": "REVISION_CONFLICT",
          "messageKey": "errors.revisionConflict",
          "requestId": "req_demo_001",
          "details": {},
          "retryable": false
        }
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "additionalProperties": false,
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ErrorBody"
          }
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Bad request",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Authentication required or expired",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Company or action forbidden",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Resource not found",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Conflict": {
        "description": "Revision, idempotency or state conflict",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unprocessable": {
        "description": "Validation failed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "TooManyRequests": {
        "description": "Rate limited",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ServiceUnavailable": {
        "description": "Provider or service unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "InternalError": {
        "description": "Internal error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    }
  }
}
